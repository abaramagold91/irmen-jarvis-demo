<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Laboratório 1 IRMEN</title>
<style>
  /* Single dark control bar above the real Portal shell; the shell keeps its own Dark/Slate tokens. */
  :root { --pv-bg: #06080c; --pv-bar: #0d121a; --pv-line: rgba(140,190,220,.24); --pv-fg: #e8eef4; --pv-muted: #a3b0bd; --pv-on: #b91c2f; --pv-warn: #f2b84b; color-scheme: dark; }
  html, body { margin: 0; } body { background: var(--pv-bg); color: var(--pv-fg); font-family: "IBM Plex Sans", system-ui, sans-serif; }
  .pv-bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 80; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--pv-bar); border-bottom: 1px solid var(--pv-line); font: 12.5px/1.3 "IBM Plex Sans", system-ui, sans-serif; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 90; background: var(--pv-bar); }
  .pv-bar b { font-weight: 600; }
  .pv-note { color: var(--pv-warn); }
  .pv-group { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .pv-group span { color: var(--pv-muted); margin-right: 2px; }
  .pv-bar button { min-height: 30px; padding: 4px 10px; border: 1px solid var(--pv-line); border-radius: 6px; background: transparent; color: var(--pv-fg); font: inherit; cursor: pointer; }
  .pv-bar button[aria-pressed="true"] { background: var(--pv-on); border-color: var(--pv-on); color: #fff; }
  .pv-bar button:focus-visible { outline: 2px solid #3fd0ff; outline-offset: 2px; }
  .pv-frame { display: block; width: 100%; border: 0; background: var(--pv-bg); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="pv-bar" role="region" aria-label="Controles da prévia">
  <div class="pv-group" role="group" aria-label="Tela" id="pv-scr">
    <span>Tela</span>
    <button type="button" data-v="dash" aria-pressed="true">Dashboard</button>
    <button type="button" data-v="clients" aria-pressed="false">Clientes (nova abertura)</button>
    <button type="button" data-v="ops" aria-pressed="false">Centro + detalhe (Laboratório 1)</button>
  </div>
  <span class="pv-note" id="pv-note">Dados fictícios · os cliques não abrem outras telas</span>
  <div class="pv-group" role="group" aria-label="Cenário" id="pv-scn">
    <span>Cenário</span>
    <button type="button" id="pv-ready" data-s="ready" aria-pressed="true">Com dados</button>
    <button type="button" id="pv-long" data-s="long">Conteúdo longo</button>
    <button type="button" id="pv-loading" data-s="loading">Carregando</button>
    <button type="button" id="pv-empty" data-s="empty">Vazio</button>
    <button type="button" id="pv-error" data-s="error">Erro</button>
    <button type="button" id="pv-denied" data-s="denied">Sem acesso</button>
  </div>
  <div class="pv-group" role="group" aria-label="Perfil" id="pv-role">
    <span>Perfil</span>
    <button type="button" data-r="coordenador_credito" aria-pressed="true">Coordenação</button>
    <button type="button" data-r="assistente_credito" aria-pressed="false">Assistente</button>
    <button type="button" data-r="vendedor" aria-pressed="false">Vendedor</button>
  </div>
  <div class="pv-group" role="group" aria-label="Tema" id="pv-thm">
    <span>Tema</span>
    <button type="button" id="pv-dark" data-t="dark" aria-pressed="true">Dark</button>
    <button type="button" id="pv-slate" data-t="slate">Slate</button>
  </div>
</div>
<iframe class="pv-frame" id="pv-clients" title="Centro de Operações"></iframe>
<script>
  (function () {
    var state = { s: 'ready', slate: false, v: 'ops', role: 'coordenador_credito' };
    document.documentElement.dataset.theme = 'irmen-industrial-dark';
    var frame = document.getElementById('pv-clients'), bar = document.querySelector('.pv-bar');
    function fit() { frame.style.height = Math.max(320, window.innerHeight - bar.offsetHeight) + 'px'; }
    window.addEventListener('resize', fit);
    function showScreen() {
      var clients = state.v === 'clients', ops = state.v === 'ops';
      document.querySelectorAll('#pv-scr button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.v === state.v)); });
      document.getElementById('pv-scn').hidden = clients;
      document.getElementById('pv-long').hidden = ops;
      document.getElementById('pv-role').hidden = !ops;
      frame.hidden = false;
      frame.title = ops ? 'Centro de Operações' : clients ? 'Central de Clientes' : 'Dashboard';
      document.getElementById('pv-note').textContent = ops ? 'Laboratório 1 · dados fictícios · abra uma operação (→) para ver o novo detalhe; Ctrl K abre a Ava; pendências operacionais simuladas em memória (troque o Perfil para ver permissões)' : clients ? 'Dados fictícios · clique num cliente para ver a transição; "Central de Clientes" volta' : 'Dados fictícios · os cliques não abrem outras telas';
      {
        var src = ops
          ? 'operacoes/index.html?r=l6' + (state.s !== 'ready' && state.s !== 'long' ? '&s=' + state.s : '') + (state.slate ? '&theme=slate' : '') + '&role=' + state.role
          : clients ? 'clientes/index.html?r=7' + (state.slate ? '&theme=slate' : '')
          : 'painel/index.html?v=dash&s=' + state.s + (state.slate ? '&theme=slate' : '');
        if (frame.getAttribute('src') !== src) frame.setAttribute('src', src); fit(); window.scrollTo(0, 0);
      }
    }
    document.getElementById('pv-scr').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) { state.v = b.dataset.v; showScreen(); } });
    function apply() {
      document.querySelectorAll('#pv-scn button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.s === state.s)); });
      document.querySelectorAll('#pv-thm button').forEach(function (b) { b.setAttribute('aria-pressed', String((b.dataset.t === 'slate') === state.slate)); });
      showScreen();
    }
    document.getElementById('pv-scn').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) { state.s = b.dataset.s; apply(); } });
    document.getElementById('pv-role').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; state.role = b.dataset.r; document.querySelectorAll('#pv-role button').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); }); showScreen(); });
    document.getElementById('pv-thm').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) { state.slate = b.dataset.t === 'slate'; apply(); } });
    showScreen();
    // The viewer may set its own data-theme on <html>; keep the Portal theme chosen here.
    new MutationObserver(function () {
      var want = state.slate ? 'irmen-executive-light' : 'irmen-industrial-dark';
      if (document.documentElement.dataset.theme !== want) document.documentElement.dataset.theme = want;
    }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  })();
</script>
</body>
</html>
